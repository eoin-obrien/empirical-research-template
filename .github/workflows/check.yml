name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.9.10"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.59.0"
      - uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: "1.6.43"
          tinytex: true
      - run: uv sync --locked
      - run: just check
      - run: just render
