[project]
name = "empirical-research-template"
version = "0.1.0"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "research"

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "I",   # isort
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", ".claude/hooks"]

[tool.pytest]
testpaths = ["tests/unit"]  # `just verify` runs tests/integrity
addopts = ["-ra", "--import-mode=importlib"]
strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
